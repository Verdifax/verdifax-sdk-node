# Continuous-integration for verdifax-sdk-node.
#
# Runs on every PR and every push to main:
#   - tsc --noEmit                  : type-check
#   - npm run build                 : compile dual CJS+ESM
#   - npm test                      : Node native test runner
#
# Test runtime is < 30 seconds. The SDK targets Node 18+ (native
# fetch); the matrix exercises 18 / 20 / 22 LTS lines.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
