# Continuous-integration for verdifax-sdk-node.
#
# Runs on every PR and every push to main:
#   - tsc --noEmit                  : type-check
#   - npm run build                 : compile dual CJS+ESM
#   - npm test                      : Node native test runner
#
# Test runtime is < 30 seconds. The SDK targets Node 22+ (native
# fetch); the matrix runs every Node release line still maintained.
# The release workflow calls this workflow and publishes only if
# every version passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
