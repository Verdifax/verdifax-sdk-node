# Continuous-integration for verdifax-sdk-node.
#
# Runs on every PR and every push to main:
#   - tsc --noEmit                  : type-check
#   - npm run build                 : compile dual CJS+ESM
#   - npm test                      : Node native test runner
#
# Test runtime is < 30 seconds. The SDK targets Node 18+ (native
# fetch); the matrix exercises 18 / 20 / 22 LTS lines.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
