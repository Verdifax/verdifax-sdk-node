# Release workflow for verdifax-sdk-node.
#
# Triggers on `v*` git tag push. Verifies the type-check + tests
# + build, then publishes to npm with provenance attestation.
#
# Provenance, npm's --provenance flag (in publishConfig as well)
# turns the published package into a signed artifact whose
# build origin is verifiable on the public Sigstore Rekor log.
# Same trust model as the verifier-CLI distribution.
#
# To cut a new release:
#
#   $EDITOR package.json     # bump version
#   npm install              # update package-lock
#   git add package.json package-lock.json
#   git commit -m "Release v0.2.0"
#   git tag v0.2.0
#   git push origin main v0.2.0
#
# Consumers update via:
#
#   npm install verdifax@0.2.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # GitHub Release creation
  id-token: write    # npm provenance via Sigstore OIDC

jobs:
  # The full CI matrix, every maintained Node line; nothing is
  # published unless it passes.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/verdifax
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22 LTS: npm@latest (v12+ as of 2026-07) requires
          # node ^22.22.2 || ^24 || >=26; the previous "20" pin broke
          # the v0.2.3 release with EBADENGINE at the npm-upgrade step.
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org/"

      # npm Trusted Publishing (OIDC) requires npm CLI v11.5.0 or newer.
      # Older Node LTS images ship npm 10.x, which does not auto-detect
      # Trusted Publisher config and falls back to no-auth publish,
      # which the registry rejects with a misleading 404. This step
      # installs an exact npm version, so a release cannot pick up a
      # newer one; npm 12 needs Node ^22.22.2, which setup-node's "22"
      # provides.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@12.2.1

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF##*/}"           # v0.2.0
          tag_no_v="${tag#v}"               # 0.2.0
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag_no_v" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish to npm with provenance
        # Authentication is via npm Trusted Publishing (OIDC), configured
        # on the npmjs.com `verdifax` package settings, no NPM_TOKEN
        # secret needed. The `id-token: write` permission at the workflow
        # level provides the Sigstore OIDC token; npm validates the OIDC
        # claims against the Trusted Publisher config (org=Verdifax,
        # repo=verdifax-sdk-node, workflow=release.yml, environment=npm)
        # before accepting the publish. The same OIDC token also signs
        # the provenance artifact.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
