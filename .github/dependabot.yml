# Keeps the dependency surfaces current: the package's own dependencies
# and the pinned GitHub Actions SHAs, which Dependabot bumps with the
# matching version comment kept in sync.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new TypeScript major changes type checking and needs its own
    # migration (TypeScript 7 failed type-check on every Node version).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One combined PR per week instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
